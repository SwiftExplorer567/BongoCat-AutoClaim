name: Bug report
description: Something doesn't work, for example after a Bongo Cat update
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. A few details help a lot.
  - type: input
    id: version
    attributes:
      label: AutoClaim version
      description: Shown on the release you downloaded, e.g. v1.0.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you saw instead
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Message at the bottom of the window
      description: Copy the line at the bottom of the AutoClaim window, or the last lines of patcher.log next to the exe
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I'm on the latest release
        - label: Bongo Cat was updated recently
